components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

    Equipment:
      type: object
      required:
        - id
        - name
        - category
        - price_per_hour
        - quantity
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price_per_hour:
          type: integer
        quantity:
          type: integer
        image_url:
          type: string
        description:
          type: string

    EquipmentCategory:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string

    EquipmentSet:
      type: object
      required:
        - id
        - name
        - sport_type
        - age_group
        - price_per_hour
        - is_active
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sport_type:
          type: string
          enum:
            - ski
            - snowboard
        age_group:
          type: string
          enum:
            - adult
            - child
        price_per_hour:
          type: integer
        is_active:
          type: boolean

    EquipmentSetItem:
      type: object
      required:
        - category_id
        - category_name
        - quantity
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        quantity:
          type: integer

    EquipmentSetDetail:
      allOf:
        - $ref: '#/components/schemas/EquipmentSet'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EquipmentSetItem'
            

    Instructors:
      type: object
      required:
        - id
        - name
        - specialization
        - experience_years
        - is_active
      properties:
        id:
          type: integer
        name:
          type: string
        specialization:
          type: string
        description:
          type: string
          nullable: true
        experience_years:
          type: integer
        is_active:
          type: boolean
        image_url:
          type: string
          nullable: true

    InstructorSchedule:
      type: object
      required:
        - id
        - starts_at
        - ends_at
      properties:
        id:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      
    BookedInterval:
      type: object
      required:
        - starts_at
        - ends_at
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        
    InstructorScheduleResponse:
      type: object
      required:
        - instructor_id
        - date
        - schedule
        - booked_intervals
      properties:
        instructor_id:
          type: integer
        date:
          type: string
          format: date
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/InstructorSchedule'
        booked_intervals:
          type: array
          items:
            $ref: '#/components/schemas/BookedInterval'
          
    InstructorBooking:
      type: object
      required:
        - id
        - client_name
        - service_name
        - starts_at
        - ends_at
        - status
      properties:
        id:
          type: integer
        client_name:
          type: string
        service_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - confirmed
            - cancelled
            - completed
            - no_show

    Service:
      type: object
      required:
        - id
        - name
        - duration_minutes
        - price
        - is_active
      properties:
        id:
          type: integer
        name:
          type: string
        duration_minutes:
          type: integer
        price:
          type: integer
        is_active:
          type: boolean
        description:
          type: string
          nullable: true
      
    AvailableSlot:
      type: object
      required:
        - starts_at
        - ends_at
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        
    
    LessonBooking:
      type: object
      required:
        - id
        - user_id
        - instructor_id
        - service_id
        - starts_at
        - ends_at
        - status
        - total_price
        - created_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        instructor_id:
          type: integer
        service_id:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - confirmed
            - cancelled
            - completed
            - no_show
        total_price:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time

    LessonBookingDetail:
      type: object
      required:
        - id
        - user_id
        - instructor_id
        - instructor_name
        - service_id
        - service_name
        - starts_at
        - ends_at
        - status
        - total_price
        - created_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        instructor_id:
          type: integer
        instructor_name:
          type: string
        service_id:
          type: integer
        service_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - confirmed
            - cancelled
            - completed
            - no_show
        total_price:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
      
    
    EquipmentAvailability:
      type: object
      required:
        - equipment_id
        - size
        - available_quantity
      properties:
        equipment_id:
          type: integer
        size:
          type: string
        available_quantity:
          type: integer
          minimum: 0

    CreateEquipmentBookingRequest:
      type: object
      description: |
        Период аренды должен находиться в будущем
        и составлять целое количество часов, минимум один час.
        Необходима хотя бы одна позиция в items или sets.
        Если массив отсутствует, он считается пустым.
      required:
        - starts_at
        - ends_at
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentBookingRequestItem'
        sets:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentBookingRequestSet'

    EquipmentBookingRequestItem:
      type: object
      required:
        - equipment_id
        - size
        - quantity
      properties:
        equipment_id:
          type: integer
          minimum: 1
        size:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1

    EquipmentBookingRequestSet:
      type: object
      description: |
        Один элемент описывает комплект с одной
        комбинацией размеров. Для других размеров
        добавляется отдельный элемент в sets.
      required:
        - equipment_set_id
        - quantity
        - sizes
      properties:
        equipment_set_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        sizes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EquipmentBookingSetSize'

    EquipmentBookingSetSize:
      type: object
      required:
        - category_id
        - size
      properties:
        category_id:
          type: integer
          minimum: 1
        size:
          type: string
          minLength: 1

    EquipmentRental:
      type: object
      required:
        - id
        - user_id
        - starts_at
        - ends_at
        - status
        - total_price
        - created_at
        - items
        - sets
      properties:
        id:
          type: integer
        user_id:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - confirmed
            - issued
            - returned
            - cancelled
        total_price:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentRentalItem'
        sets:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentRentalSet'

    EquipmentRentalItem:
      type: object
      required:
        - equipment_unit_id
        - equipment_id
        - name
        - size
        - booked_set_id
        - item_total_price
      properties:
        equipment_unit_id:
          type: integer
        equipment_id:
          type: integer
        name:
          type: string
        size:
          type: string
        booked_set_id:
          type: integer
          nullable: true
        item_total_price:
          type: integer
          minimum: 0
          nullable: true

    EquipmentRentalSet:
      type: object
      required:
        - id
        - equipment_set_id
        - name
        - total_price
      properties:
        id:
          type: integer
        equipment_set_id:
          type: integer
        name:
          type: string
        total_price:
          type: integer
          minimum: 0

    
    AdminLessonStatus:
      type: string
      enum: [confirmed, cancelled, completed, no_show]

    AdminRentalStatus:
      type: string
      enum: [pending, confirmed, issued, returned, cancelled]

    AdminUnitStatus:
      type: string
      enum: [available, maintenance, written_off]

    AdminClient:
      type: object
      required: [id, name, email, phone]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }

    AdminService:
      type: object
      required: [id, name, description, duration_minutes, price, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        duration_minutes: { type: integer }
        price: { type: integer }
        is_active: { type: boolean }

    AdminCreateServiceRequest:
      type: object
      required: [name, duration_minutes, price]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        duration_minutes: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 0 }
        is_active: { type: boolean, default: true }

    AdminUpdateServiceRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        duration_minutes: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 0 }
        is_active: { type: boolean }

    AdminInstructor:
      type: object
      required: [id, name, specialization, description, experience_years, image_url, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        specialization: { type: string }
        description: { type: string, nullable: true }
        experience_years: { type: integer }
        image_url: { type: string, nullable: true }
        is_active: { type: boolean }

    AdminCreateInstructorRequest:
      type: object
      required: [user_id, specialization, experience_years]
      properties:
        user_id: { type: integer, minimum: 1 }
        specialization: { type: string, minLength: 1 }
        experience_years: { type: integer, minimum: 0 }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    AdminUpdateInstructorRequest:
      type: object
      minProperties: 1
      properties:
        specialization: { type: string, minLength: 1 }
        experience_years: { type: integer, minimum: 0 }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        is_active: { type: boolean }

    AdminAssignInstructorServiceRequest:
      type: object
      required: [service_id]
      properties:
        service_id: { type: integer, minimum: 1 }

    AdminSchedule:
      type: object
      required: [id, starts_at, ends_at]
      properties:
        id: { type: integer }
        starts_at: { type: string, format: date-time }
