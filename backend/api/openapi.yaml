          schema:
            type: integer
      responses:
        '200':
          description: Комплект снаряжения по id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentSetDetail'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            
  /instructors:
    get:
      tags:
        - Instructor
      summary: "Получить список всех инструкторов"
      operationId: listInstructors
      responses:
        '200':
          description: Список инструкторов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instructors'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          
  /instructors/{id}:
    get:
      tags: 
      - Instructor
      summary: Получить информацию об инструкторе
      operationId: getInstructorByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение инструктора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructors'
        '404':
          description: Инструктор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        
  /instructors/{id}/schedule:
    get:
      tags:
        - Instructor
      summary: Получить расписание инструктора по id
      operationId: getInstructorScheduleByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date 
      responses:
        '200':
          description: Успешное получение расписание инструктора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorScheduleResponse'
        '404':
          description: Инструктор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              
  /instructors/{id}/available-slots:
    get:
      tags:
        - Instructor
      summary: Получить доступные слоты инструктора для выбранной услуги
      operationId: getInstructorAvailableSlots
      parameters:
        - name: id
          in: path
          required: true
          description: ID инструктора
          schema:
            type: integer
        - name: service_id
          in: query
          required: true
          description: ID выбранной услуги
          schema:
            type: integer
        - name: date
          in: query
          required: true
          description: Дата занятия по московскому времени
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Список доступных слотов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSlot'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Инструктор или услуга не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Инструктор не оказывает выбранную услугу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  

  /instructors/me/bookings:
    get:
      tags: 
      - Instructor
      summary: Получить бронирования занятий текущего инструктора
      operationId: getMyInstructorBookings
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Успешное получение рассписания
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstructorBooking'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Некорректный формат даты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещён. Пользователь не является инструктором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /instructors/{id}/services:
    get:
      tags:
        - Instructor
      summary: Получить услуги конкретного инструктора
      operationId: getInstructorServices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список активных услуг инструктора
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          description: Некорректный ID инструктора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Инструктор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              
  /services:
    get:
      tags:
        - services
      summary: Получить список доступных услуг
      operationId: listServices
      responses:
        '200':
          description: Список услуг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 
          
  /services/{id}:
    get:
      tags:
        - services
      summary: Получить услугу по id
      operationId: getServiceByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Получение услуги по id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Неверный id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Услуга не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 
          
  
  /lesson-bookings:
    post:
      tags:
        - bookings
      summary: Создать бронирование занятия
      operationId: createLessonBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructor_id
                - service_id
                - starts_at
              properties:
                instructor_id:
                  type: integer
                  minimum: 1
                service_id:
                  type: integer
                  minimum: 1
                starts_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Бронирование успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonBooking'
        '400':
          description: Некорректные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Инструктор или услуга не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Выбранное время уже занято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Невозможно забронировать занятие с указанными параметрами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lesson-bookings/my:
    get:
      tags:
        - bookings
      summary: Получить свои бронирования занятий
      operationId: getMyLessonBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - confirmed
              - cancelled
              - completed
              - no_show
      responses:
        '200':
          description: Список бронирований пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonBookingDetail'
        '400':
          description: Некорректный параметр запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lesson-bookings/{id}:
    get:
      tags:
        - bookings
      summary: Получить бронирование занятия по ID
      operationId: getLessonBookingById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Информация о бронировании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonBookingDetail'
        '400':
          description: Некорректный ID бронирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Бронирование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lesson-bookings/{id}/cancel:
    patch:
      tags:
        - bookings
      summary: Отменить своё бронирование занятия
      operationId: cancelLessonBooking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Бронирование успешно отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonBookingDetail'
        '400':
          description: Некорректный ID бронирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Бронирование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Бронирование нельзя отменить в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              
  /equipment/availability:
    get:
      tags:
        - rental
      summary: Получить доступность оборудования на выбранный период
      operationId: getEquipmentAvailability
      parameters:
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: ends_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: equipment_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Доступное количество оборудования по размерам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentAvailability'
        '400':
          description: Некорректный период или параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Оборудование не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /equipment-bookings:
    post:
      tags:
        - rental
      summary: Создать бронирование оборудования или комплектов
      operationId: createEquipmentBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentBookingRequest'
      responses:
        '201':
          description: Бронирование оборудования создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentRental'
        '400':
          description: Некорректные входные данные или период аренды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
