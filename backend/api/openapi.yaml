openapi: 3.0.3

info:
  title: Ski Resort API
  version: 1.0.0

paths:
  /auth/register:
    post:
      tags:
        - Аuth
      operationId: registerUser
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phone
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - email
                  - role
                  - access_token
                  - token_type
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - client
                      - instructor
                      - admin
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
        '400':
          description: "Некорректные данные запроса"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: "Пользователь с таким email уже существует"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Ошибка сервера"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Аuth
      operationId: loginUser
      summary: Вход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: "Успешная аутентификация"
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
        '400':
          description: "Некорректные данные"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: "Неверные данные"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Ошибка сервера"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /equipment:
    get:
      tags:
        - Equipment
      summary: Получить список снаряжения
      operationId: listEquipment
      parameters:
        - name: category
          in: query
          required: false
          description: Фильтрация по категории снаряжения
          schema:
            type: string
      responses:
        '200':
          description: Список моделей снаряжения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /equipment/{id}:
    get:
      tags:
        - Equipment
      summary: Получить снаряжение по id
      operationId: getEquipmentByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Снаряжение по id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              
  /equipment/categories:
    get:
      tags: 
        - Equipment
      summary: Получить категории снаряжения
      operationId: getEquipmentCategories
      responses:
        '200':
          description: Список категорий снаряжения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentCategory'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /equipment/sets:
    get:
      tags:
        - Equipment
      summary: Получить список комплектов снаряжения
      operationId: getEquipmentSets
      responses:
        '200':
          description: Список комплектов снаряжения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentSet'
        '500':
          description: Внутреняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            
  /equipment/sets/{id}:
    get:
      tags:
        - Equipment
      summary: Получить комплект снаряжения по id
      operationId: getEquipmentSetByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Комплект снаряжения по id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentSetDetail'
        '400':
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        


components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

    Equipment:
      type: object
      required:
        - id
        - name
        - category
        - price_per_hour
        - quantity
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price_per_hour:
          type: integer
        quantity:
          type: integer
        image_url:
          type: string
        description:
          type: string

    EquipmentCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    EquipmentSet:
      type: object
      required:
        - id
        - name
        - sport_type
        - age_group
        - price_per_hour
        - is_active
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sport_type:
          type: string
          enum:
            - ski
            - snowboard
        age_group:
          type: string
          enum:
            - adult
            - child
        price_per_hour:
          type: integer
        is_active:
          type: boolean

    EquipmentSetItem:
      type: object
      required:
        - category_id
        - category_name
        - quantity
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        quantity:
          type: integer

    EquipmentSetDetail:
      allOf:
        - $ref: '#/components/schemas/EquipmentSet'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EquipmentSetItem'

    