services:
  postgres:
    image: postgres:17
    container_name: ski-resort-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ski_user
      POSTGRES_PASSWORD: ski_password
      POSTGRES_DB: ski_resort

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: